<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>It's over 9000</title>
	<link rel="stylesheet" href="calc.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
	<form id="calcForm">
		<input type="text" id="leftNum">
		<select id="operator">
			<option value="+">+</option>
			<option value="-">-</option>
			<option value="*">*</option>
			<option value="/">/</option>
			<option value="%">%</option>
		</select>
		<input type="text" id="rightNum">
		<input type="submit" value="Try me!">
	</form>
	<script src="calc.js"></script>
</body>
</html>
