<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>User Profile Card</title>
	<link rel="stylesheet" href="card.css">
</head>
<body>

	<h1>User Profile Card</h1>

	<!-- Invisible Table for Alignment -->
	<table class="card-table">
		<tr>
			<td>
				<!-- เปลี่ยน path รูปตรงนี้เป็น path รูปฮัสกี้ของคุณ -->
				<img class="profile-pic" src="husky.jpg" alt="Husky Profile">
			</td>
		</tr>
		<tr>
			<!-- อัปเดตชื่อผู้ใช้งาน -->
			<td class="user-name">Husky</td>
		</tr>
		<tr>
			<!-- อัปเดตคำอธิบายเพิ่มเติม -->
			<td class="user-desc">Intensity Level: Max</td>
		</tr>
		<tr>
			<!-- อัปเดตสถานที่ -->
			<td class="user-location">Samut Prakan, Thailand</td>
		</tr>
		<tr>
			<td class="social-icons">
				<a href="#"><img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png" alt="web"></a>
				<a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="twitter"></a>
				<a href="#"><img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png" alt="linkedin"></a>
				<a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="facebook"></a>
			</td>
		</tr>
		<tr>
			<td>
				<a href="#" class="btn-contact">Contact</a>
			</td>
		</tr>
	</table>

</body>
</html>
