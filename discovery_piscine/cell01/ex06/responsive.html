<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Responsive</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body, html {
			width: 100vw;
			height: 100vh;
			overflow: hidden;
		}

		table {
			width: 100%;
			height: 100%;
			border-collapse: collapse;
			table-layout: fixed;
		}

		td {
			width: 50%;
			height: 100%;
			text-align: center;
			vertical-align: middle;
			font-family: sans-serif;
			font-size: 2rem;
		}

		.left {
			background-color: #4a90e2;
			color: white;
		}

		.right {
			background-color: #50e3c2;
			color: white;
		}
	</style>
</head>
<body>
	<table>
		<tr>
			<td class="left">Cell 1</td>
			<td class="right">Cell 2</td>
		</tr>
	</table>
</body>
</html>
